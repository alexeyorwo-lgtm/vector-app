name: Build Windows 7 EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Получаем файлы
      uses: actions/checkout@v4

    - name: Устанавливаем Python 3.8 (Для Windows 7)
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: Устанавливаем библиотеки
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==5.13.2

    - name: Собираем EXE файл (ПРИНУДИТЕЛЬНАЯ ЗАПАКОВКА CV2)
      run: pyinstaller --noconsole --onefile --hidden-import cv2 app.py

    - name: Сохраняем готовый файл
      uses: actions/upload-artifact@v4
      with:
        name: VectorMaster-Win7-Edition
        path: dist/app.exe


